name: Windows CI

on:
  push:
    branches: [main, windows-stage-1]
    paths:
      - "Windows/**"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "Windows/**"
      - ".github/workflows/windows-ci.yml"

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build, test, selftest
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Windows/global.json

      - name: Restore
        run: dotnet restore Faqra.sln

      - name: Build
        run: dotnet build Faqra.sln -c Release --no-restore

      - name: Unit tests
        # GitHub's Windows runners have no audio endpoints; tests that need one run on desktops only.
        run: dotnet test Faqra.sln -c Release --no-build --filter "Requires!=AudioDevice" --logger "trx;LogFileName=results.trx"

      - name: Selftest
        run: ./src/Faqra.App/bin/Release/net8.0-windows10.0.19041.0/Faqra.exe --selftest
